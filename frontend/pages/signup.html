<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bye Meet - Signup</title>
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/buttons.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" href="/assets/images/logo.png">
</head>
<body>

<div class="container">

    <a href="landing.html" class="back-home-link"><i class="fa-solid fa-arrow-left"></i> Back to home</a>

    <img src="../assets/images/login.png" class="illustration" alt="Sign up illustration">

    <h1>Create Account</h1>
    <p class="tagline">Join Bye Meet today</p>

    <form onsubmit="signup(); return false;">
        <div class="field-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="Jane Doe" required>
        </div>
        <div class="field-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="field-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <div class="field-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="••••••••" required>
        </div>

        <button type="submit" id="signupBtn" class="btn btn-primary btn-block">Create Account</button>
    </form>

    <div class="links single">
        <a href="login.html">Already have an account? Login</a>
    </div>

</div>

<script src="../assets/js/script.js"></script>
</body>
</html>
