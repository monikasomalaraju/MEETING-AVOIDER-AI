<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Meeting</title>
    <link rel="stylesheet" href="../assets/css/add-meeting.css">
</head>
<body>

<div class="container">

    <div class="form-card">

        <div class="logo">
            <h1>📅 Add Meeting</h1>
            <p>Schedule a new meeting</p>
        </div>

        <div class="input-group">
            
            <label for="meetingDate">Meeting Date</label> 
                <input
                  type="date"
                  id="meetingDate">
        </div>

        <div class="input-group">
            <label for="title">Meeting Title</label>
            <input
                type="text"
                id="title"
                placeholder="Product Review Meeting">
        </div>

        <div class="input-group">
            <label>Meeting Time</label>
            <div class="time-row">
                <select id="hour">
                    <option>01</option>
                    <option>02</option>
                    <option>03</option>
                    <option>04</option>
                    <option>05</option>
                    <option>06</option>
                    <option>07</option>
                    <option>08</option>
                    <option>09</option>
                    <option>10</option>
                    <option>11</option>
                    <option>12</option>
                </select>

                <select id="minute">
                    <option>00</option>
                    <option>05</option>
                    <option>10</option>
                    <option>15</option>
                    <option>20</option>
                    <option>25</option>
                    <option>30</option>
                    <option>35</option>
                    <option>40</option>
                    <option>45</option>
                    <option>50</option>
                    <option>55</option>
                </select>

                <select id="ampm">
                    <option>AM</option>
                    <option>PM</option>
                </select>
            </div>
        </div>

        <div class="input-group">
            <label for="link">Meeting Link</label>
            <input
                type="url"
                id="link"
                placeholder="https://meet.google.com/...">
        </div>

        <div class="input-group">
            <label for="participants">Participants</label>
            <input
                type="text"
                id="participants"
                placeholder="john@gmail.com, sara@gmail.com">
        </div>

        <div class="input-group">

        <label>Meeting Type</label>

        <select id="meetingType">

            <option>Google Meet</option>

            <option>Zoom</option>

            <option>Microsoft Teams</option>

            <option>In Person</option>

        </select>

    </div>

        <button
            id="saveMeetingBtn"
            class="save-btn"
            onclick="saveMeeting()">

            Save Meeting

        </button>

        <a
            href="calendar.html"
            class="back-btn">

            ← Back to Calendar

        </a>

    </div>

 </div>
 <script src="../assets/js/add-meeting.js"></script>
 <script src="../assets/js/browser-notifications.js"></script>
</body>
</html>
