<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bye Meet - Forgot Password</title>
    <link rel="stylesheet" href="../assets/css/dashboard.css">
    <link rel="stylesheet" href="../assets/css/buttons.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" href="/assets/images/logo.png">
</head>
<body>
    <div class="container">

        <a href="landing.html" class="back-home-link"><i class="fa-solid fa-arrow-left"></i> Back to home</a>

        <img src="../assets/images/forgot.png" class="illustration" alt="Forgot password illustration">

        <h1>Forgot Password</h1>
        <p class="tagline">We'll send you a reset link</p>

        <div class="field-group">
            <label for="resetEmail">Email</label>
            <input type="email" id="resetEmail" placeholder="you@example.com" required>
        </div>

        <button type="button" class="btn btn-primary btn-block" onclick="resetPassword()">Send Reset Link</button>

        <div class="links single">
            <a href="login.html">Back to Login</a>
        </div>
    </div>

    <script src="../assets/js/script.js"></script>
</body>
</html>
